name: Build EclipseClient

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + verify jar)
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Check jar contents
        run: |
          ls -l build/libs/
          test -f build/libs/EclipseClient-1.21.11.jar
          unzip -p build/libs/EclipseClient-1.21.11.jar fabric.mod.json
          unzip -l build/libs/EclipseClient-1.21.11.jar | grep -c 'pl/eclipse/client/' 

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-1.21.11
          path: build/libs/EclipseClient-1.21.11.jar
          if-no-files-found: error
